<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kuba to GOAT</title>

    <style>
        body {
            margin: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;

            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 60px;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88;
        }

        p {
            font-size: 20px;
            color: #aaa;
        }

        .buttons {
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 10px;

            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;

            transition: 0.2s;
        }

        .tiktok {
            background-color: #111;
            border: 2px solid #ff0050;
        }

        .instagram {
            background: linear-gradient(45deg, #ffdc80, #fcaf45, #f77737, #e1306c, #c13584, #833ab4);
        }

        .button:hover {
            transform: scale(1.08);
        }
    </style>
</head>

<body>

    <div>
        <h1>KUBA TO GOAT 🐐</h1>

        <p>Najlepszy. Bez dyskusji.</p>

        <div class="buttons">

            <a class="button tiktok"
               href="https://www.tiktok.com/@9090kuba"
               target="_blank">
                🎵 TikTok
            </a>

            <a class="button instagram"
               href="https://www.instagram.com/jromanski_/"
               target="_blank">
                📸 Instagram
            </a>

        </div>
    </div>

</body>
</html>
